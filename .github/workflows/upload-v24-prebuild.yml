name: Sync v24.18.0 prebuilds to release

# One-shot: mirror all node-v24.18.0 binaries from yao-pkg onto this repo's v3.6 release.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Download, verify, and upload all v24.18.0 assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          declare -A EXPECTED=(
            [node-v24.18.0-alpine-arm64]=d4a4302a0a127c3d4949f86c00242e9b42cc57d8b94913d0813daa6f979b2c71
            [node-v24.18.0-alpine-x64]=f497cb461d1b9cccf4bfae71b6311754843d4048fb73345f514d845c9fe91f21
            [node-v24.18.0-linux-arm64]=84b746637c2a0e51f746cd937c2f78cbfd8cbdf7df035ad5e2c80c892e95a7c4
            [node-v24.18.0-linux-x64]=e55f89d2769702117fd42a5f83a3132b39c24229bf80748ad73372dd1a7d0fd8
            [node-v24.18.0-linuxstatic-arm64]=71eebc90e28e4d5bce3d6cf8f386be1cde14665c094b501302ad1b87a7957cf3
            [node-v24.18.0-linuxstatic-x64]=3876f1638d5b9cbc2a368c39343de2c0ad64458f5f5a49b361ee066ed55736aa
            [node-v24.18.0-macos-arm64]=f7cb0dba323eb7918b507d6cc8970e42ffa3e0a2252515fb8fc78f5e15fd6096
            [node-v24.18.0-macos-x64]=b9d1fc6bf8c813e286be429571801fa06a385997c4c9686a536a8e611d4bdbca
            [node-v24.18.0-win-arm64]=58daa4bfde8ca5d0c7140bc3fd3977bbc424e5c30ec8bdce8498edc41bccff17
            [node-v24.18.0-win-x64]=430b93420ce5c670698c90a935274a754ac655a97924b486ea2d7d3371a02e0c
          )

          SRC=https://github.com/yao-pkg/pkg-fetch/releases/download/v3.6
          mkdir -p assets
          cd assets

          for name in "${!EXPECTED[@]}"; do
            echo "==> $name"
            curl -fL --retry 5 --retry-delay 2 -o "$name" "${SRC}/${name}"
            curl -fL --retry 5 --retry-delay 2 -o "${name}.sha256sum" "${SRC}/${name}.sha256sum"
            echo "${EXPECTED[$name]}  ${name}" | sha256sum -c -
          done

          if ! gh release view v3.6 -R "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create v3.6 \
              -R "${{ github.repository }}" \
              --title 'v3.6' \
              --notes 'Prebuilt patched Node binaries for @sunjingyun/pkg-fetch 3.6.x (node-v24.18.0).'
          fi

          gh release upload v3.6 -R "${{ github.repository }}" --clobber ./*
          gh release edit v3.6 -R "${{ github.repository }}" --draft=false --latest
          gh release view v3.6 -R "${{ github.repository }}"
