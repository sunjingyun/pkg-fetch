name: Upload v24.18.0 prebuild to release

# Downloads the verified yao-pkg node-v24.18.0-linux-x64 binary (same sha as
# expected-shas.json), then publishes it on this repo's v3.6 release.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Download and verify binary
        run: |
          set -euo pipefail
          EXPECTED=e55f89d2769702117fd42a5f83a3132b39c24229bf80748ad73372dd1a7d0fd8
          NAME=node-v24.18.0-linux-x64
          curl -fL --retry 5 --retry-delay 2 \
            -o "$NAME" \
            "https://github.com/yao-pkg/pkg-fetch/releases/download/v3.6/${NAME}"
          echo "${EXPECTED}  ${NAME}" > "${NAME}.sha256sum"
          sha256sum -c "${NAME}.sha256sum"
          ls -lh "$NAME"

      - name: Ensure release exists and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          NAME=node-v24.18.0-linux-x64
          if ! gh release view v3.6 -R "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create v3.6 \
              -R "${{ github.repository }}" \
              --title 'v3.6' \
              --notes 'Prebuilt patched Node binaries for @sunjingyun/pkg-fetch 3.6.x'
          fi
          gh release upload v3.6 -R "${{ github.repository }}" --clobber \
            "$NAME" "${NAME}.sha256sum"
          gh release edit v3.6 -R "${{ github.repository }}" --draft=false --latest
          gh release view v3.6 -R "${{ github.repository }}"
